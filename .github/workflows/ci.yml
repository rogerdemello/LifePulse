name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # v4/v5 target Node 20, which the runners now force onto Node 24 with a
      # deprecation warning on every run. v7 of each targets it properly. The
      # breaking change in checkout v7 is a safer default for
      # pull_request_target, which this workflow does not use.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Must match .python-version, which is what the deploy reads. The
          # pinned wheels in requirements.txt are built for this version and
          # numpy 1.26 / pandas 2.1 publish none for 3.13, so a mismatch does
          # not fall back to a slower install -- it fails the build.
          # tests/test_deploy.py asserts the two stay in step.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
        env:
          # Windows consoles default to cp1252 and the log lines contain
          # non-ASCII; keep output encoding explicit so this behaves the same
          # everywhere.
          PYTHONIOENCODING: utf-8

      - name: Check the app boots and every model loads
        run: |
          python - <<'EOF'
          from wsgi import app

          with app.test_client() as client:
              response = client.get('/healthz')
              payload = response.get_json()
              print(payload)
              assert response.status_code == 200, payload
              assert all(payload['models'].values()), payload
          EOF

      - name: Check the committed models match the feature code
        # Guards the failure this project was built to prevent: artifacts and
        # feature code drifting apart. Cheap, and it fails loudly.
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          from app.ml.features import FEATURES

          for name, expected in FEATURES.items():
              saved = json.loads(
                  Path(f'app/models/{name}/features.json').read_text('utf-8')
              )
              assert saved == expected, f'{name} is stale: retrain it'
              print(f'{name}: {len(saved)} features OK')
          EOF
