{% extends "base.html" %}

{% block title %}{{ title }} - LifePulse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5 text-center">
          <div class="mb-3">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;" aria-hidden="true"></i>
          </div>
          <h1 class="h4 fw-bold mb-3">{{ title }}</h1>
          <p class="text-muted mb-4">{{ message }}</p>
          <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a href="javascript:history.back()" class="btn btn-primary">
              <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Go back
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
              <i class="bi bi-house me-1" aria-hidden="true"></i>Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
